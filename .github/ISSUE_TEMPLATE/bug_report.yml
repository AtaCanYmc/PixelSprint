name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a session
        2. Open it on a second device
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      options: [Host, Participant, Both]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, OS, installed as PWA or not
      placeholder: Chrome 131, Android 15, PWA
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.3.0
  - type: textarea
    id: logs
    attributes:
      label: Console output
      render: text
